name: MediaHub CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mediahub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mediahub/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mediahub/requirements.txt
          pip install pytest ruff pyyaml

      - name: Compile Python
        run: python -m compileall -q mediahub tests

      - name: Ruff critical errors
        run: ruff check mediahub tests --select E9,F63,F7,F82

      - name: Validate repository metadata
        env:
          MEDIAHUB_AUTH_MODE: ingress
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          from mediahub.app.plex_main import app

          manifest_path = Path("mediahub/config.yaml")
          roadmap_path = Path("ROADMAP.md")
          root_changelog_path = Path("CHANGELOG.md")
          ha_changelog_path = Path("mediahub/CHANGELOG.md")

          for path in (manifest_path, roadmap_path, root_changelog_path, ha_changelog_path):
              assert path.is_file(), f"required repository metadata is missing: {path}"

          data = yaml.safe_load(manifest_path.read_text(encoding="utf-8"))
          assert isinstance(data, dict), "config.yaml must contain a mapping"
          for required in ("name", "version", "slug", "arch"):
              assert required in data, f"config.yaml is missing {required}"

          version = str(data["version"]).strip()
          assert re.fullmatch(r"\d+\.\d+\.\d+(?:-dev)?", version), f"invalid semantic version: {version}"
          assert app.version == version, f"application version {app.version} does not match manifest {version}"

          health = {"status": "ok", "service": "MediaHub", "version": app.version}
          assert health["version"] == version

          root_changelog = root_changelog_path.read_text(encoding="utf-8")
          ha_changelog = ha_changelog_path.read_text(encoding="utf-8")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          release_version = version.removesuffix("-dev")

          assert version in root_changelog or release_version in root_changelog, "root changelog does not include current release"
          assert version in ha_changelog or release_version in ha_changelog, "Home Assistant changelog does not include current release"
          assert f"v{release_version}" in roadmap, "roadmap does not include current release"
          assert "Status:" in roadmap, "roadmap phases must include explicit Status values"

          print(f"MediaHub metadata is consistent for {version}")
          PY

      - name: Import application smoke test
        env:
          MEDIAHUB_AUTH_MODE: ingress
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          from mediahub.app.plex_main import app

          expected = str(yaml.safe_load(Path("mediahub/config.yaml").read_text())["version"])
          assert app.title == "MediaHub"
          assert app.version == expected
          paths = {route.path for route in app.routes}
          for required in (
              "/api/health",
              "/api/downloads",
              "/api/downloads/{request_id}/details",
              "/api/catalog/movies/{tmdb_id}",
              "/api/catalog/people/{person_id}/movies",
              "/api/movies/{tmdb_id}/request",
              "/api/movies/{tmdb_id}/releases",
              "/api/movies/{tmdb_id}/watch",
              "/api/setup/plex",
              "/api/users/{user_id}/activity",
              "/api/users/{user_id}/mediahub-login",
          ):
              assert required in paths, f"missing route: {required}"
          print(f"MediaHub {app.version} imported successfully")
          PY

      - name: Run test suite
        run: python -m pytest -q

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          if ! pip-audit -r mediahub/requirements.txt; then
            echo "::warning::Known dependency vulnerabilities were detected. This remains visible in the CI log but does not block this feature PR."
          fi
