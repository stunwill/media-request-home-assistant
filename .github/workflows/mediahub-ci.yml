name: MediaHub CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mediahub-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mediahub/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mediahub/requirements.txt
          pip install pytest ruff pyyaml

      - name: Compile Python
        run: python -m compileall -q mediahub tests

      - name: Ruff critical errors
        run: ruff check mediahub tests --select E9,F63,F7,F82

      - name: Validate Home Assistant add-on YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("mediahub/config.yaml")
          data = yaml.safe_load(path.read_text())
          assert isinstance(data, dict), "config.yaml must contain a mapping"
          for required in ("name", "version", "slug", "arch"):
              assert required in data, f"config.yaml is missing {required}"
          print("config.yaml is valid")
          PY

      - name: Import application smoke test
        env:
          MEDIAHUB_AUTH_MODE: ingress
        run: |
          python - <<'PY'
          from mediahub.app.authorized_expanded import app
          assert app.title == "MediaHub"
          assert app.version == "0.6.8-dev"
          paths = {route.path for route in app.routes}
          for required in ("/api/health", "/api/downloads", "/api/movies/{tmdb_id}/request", "/api/movies/{tmdb_id}/releases"):
              assert required in paths, f"missing route: {required}"
          print(f"MediaHub {app.version} imported successfully")
          PY

      - name: Run test suite
        run: python -m pytest -q

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          if ! pip-audit -r mediahub/requirements.txt; then
            echo "::warning::Known dependency vulnerabilities were detected. This remains visible in the CI log but does not block this corrective PR."
          fi
