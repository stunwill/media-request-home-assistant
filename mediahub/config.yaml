name: MediaHub
version: "0.14.2-dev"
slug: mediahub
description: Family-friendly movie and TV request management for Home Assistant
url: https://github.com/stunwill/media-request-home-assistant
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: MediaHub external login interface
panel_icon: mdi:movie-open
panel_title: MediaHub
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: default
map:
  - media:rw
  - share:rw
options:
  storage:
    media_path: /media
    minimum_free_gb: 50
    safety_margin_gb: 10
    reservation_multiplier: 1.5
  approvals:
    auto_approve: true
  tv_downloads:
    maximum_season_size_gb: 10.0
    maximum_episode_size_gb: 1.0
  integrations:
    tmdb_api_key: ""
    prowlarr_url: ""
    prowlarr_api_key: ""
    radarr_url: ""
    radarr_api_key: ""
    radarr_root_folder_path: ""
    radarr_quality_profile_id: ""
    sonarr_url: ""
    sonarr_api_key: ""
    sonarr_root_folder_path: ""
    sonarr_quality_profile_id: ""
    qbittorrent_url: ""
    qbittorrent_auth_method: password
    qbittorrent_api_key: ""
    qbittorrent_username: ""
    qbittorrent_password: ""
    plex_url: ""
    plex_token: ""
    plex_library_key: ""
    plex_machine_identifier: ""
schema:
  storage:
    media_path: str
    minimum_free_gb: float
    safety_margin_gb: float
    reservation_multiplier: float
  approvals:
    auto_approve: bool
  tv_downloads:
    maximum_season_size_gb: float
    maximum_episode_size_gb: float
  integrations:
    tmdb_api_key: password
    prowlarr_url: str
    prowlarr_api_key: password
    radarr_url: str
    radarr_api_key: password
    radarr_root_folder_path: str
    radarr_quality_profile_id: str
    sonarr_url: str
    sonarr_api_key: password
    sonarr_root_folder_path: str
    sonarr_quality_profile_id: str
    qbittorrent_url: str
    qbittorrent_auth_method: list(api_key|password)
    qbittorrent_api_key: password
    qbittorrent_username: str
    qbittorrent_password: password
    plex_url: str
    plex_token: password
    plex_library_key: str
    plex_machine_identifier: str
