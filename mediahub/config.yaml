name: MediaHub
version: "0.14.1-dev"
slug: mediahub
description: Family-friendly movie and TV request management for Home Assistant
url: https://github.com/stunwill/media-request-home-assistant
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: MediaHub external login interface
panel_icon: mdi:movie-open
panel_title: MediaHub
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: default
map:
  - media:rw
  - share:rw
options:
  storage:
    media_path: /media
    minimum_free_gb: 50
    safety_margin_gb: 10
    reservation_multiplier: 1.5
  approvals:
    auto_approve: true
  tv_downloads:
    maximum_season_size_gb: 10.0
    maximum_episode_size_gb: 1.0
  integrations:
    tmdb_api_key: ""
    prowlarr_url: ""
    prowlarr_api_key: ""