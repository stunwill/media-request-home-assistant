name: MediaHub
version: "0.2.0-dev"
slug: mediahub
description: Family-friendly movie and TV request management for Home Assistant
url: https://github.com/stunwill/media-request-home-assistant
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:movie-open
panel_title: MediaHub
homeassistant_api: true
hassio_api: true
map:
  - media:rw
  - share:rw
options:
  storage:
    media_path: /media
    minimum_free_gb: 50
    safety_margin_gb: 10
    reservation_multiplier: 1.5
  approvals:
    auto_approve: true
  integrations:
    tmdb_api_key: ""
    prowlarr_url: "http://local-prowlarr:9696"
    prowlarr_api_key: ""
    radarr_url: ""
    radarr_api_key: ""
    sonarr_url: ""
    sonarr_api_key: ""
    qbittorrent_url: ""
    qbittorrent_username: ""
    qbittorrent_password: ""
schema:
  storage:
    media_path: str
    minimum_free_gb: float
    safety_margin_gb: float
    reservation_multiplier: float
  approvals:
    auto_approve: bool
  integrations:
    tmdb_api_key: password
    prowlarr_url: str
    prowlarr_api_key: password
    radarr_url: str
    radarr_api_key: password
    sonarr_url: str
    sonarr_api_key: password
    qbittorrent_url: str
    qbittorrent_username: str
    qbittorrent_password: password
